[project]
name = "datasette-sqlite-history-json"
version = "0.1a0"
description = "Track changes to data using triggers and hidden JSON tables"
readme = "README.md"
authors = [{name = "Simon Willison"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a24",
    "sqlite-history-json>=0.3a0"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/datasette/datasette-sqlite-history-json"
Changelog = "https://github.com/datasette/datasette-sqlite-history-json/releases"
Issues = "https://github.com/datasette/datasette-sqlite-history-json/issues"
CI = "https://github.com/datasette/datasette-sqlite-history-json/actions"

[project.entry-points.datasette]
sqlite_history_json = "datasette_sqlite_history_json"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
datasette_sqlite_history_json = ["static/*", "templates/*"]

